function capitalize(s) {
  return s[0].toUpperCase()+s.slice(1);
}

function splitCamelCase(s) {
  return s.split(/(?<=[a-z])(?=[A-Z])|(?<=[A-Z])(?=[A-Z][a-z&&[^s]])/);
}

function translate(s) {
  return splitCamelCase(s.replace('_C','')).map(capitalize).join(' ');
}

function setClass(e, set, c) { set ? e.classList.add(c) : e.classList.remove(c);}
function toggleClass(e, c) { if (e.classList.contains(c)) { e.classList.remove(c); return false; } else { e.classList.add(c); return true; }}
function toggleNav(e) { let input = document.querySelector('#search-input'); toggleClass(e.parentElement, 'closed') ? input.blur() : input.focus();}
function toggleVisibility(a) { [].forEach.call(a, function(e) { toggleClass(document.querySelector(e), 'collapsed'); }) }

function getColor(typeName){
  let color = iconData[ typeData[ typeName ]?.icon ]?.bg;
  return color;
}

function getType(feature) {
  let type = feature.properties.type;
  let prop = typeData[type];
/*
  if (prop && prop.material && feature.properties.material) {
    newType = prop.material[feature.properties.material];
    if (newType && typeData[newType]) {
      prop = typeData[newType];
      type = newType;
    }
  }
*/
  let newType = prop && (prop.material?.[feature.properties.material] || prop.color?.[feature.properties.color] || prop.name?.[feature.properties.name]);

  if (typeData[newType]) {
    prop = typeData[newType];
    type = newType;
  }

  return {...prop || {icon:'misc', group:'misc'}, type: type, title: (prop||{}).title || translate(feature.properties.type)};
}

const getIcon = f => getType(f).icon;
const getGroup = f =>getType(f).group;

let mouseMoved = false;

function getBaseURL() {
  return window.location.href.replace(/#.*$/,'');
}

function getMapURL(id) { return getBaseURL() + '#' + encodeURIComponent(id); }

function getWikiURL(title) {
  if (title.startsWith('«') && title.endsWith('«')) title = title.slice(1,-1);
  let wikiPrefix = 'https://supraverse.fandom.com/wiki/';
  return wikiPrefix + encodeURIComponent(title);
}


let copyLink = e=>{ copyToClipboard(e.target.href); return false; };

function copyToClipboard(text) {
  let input = document.body.appendChild(document.createElement("input"));
  input.value = text;
  const prev = document.activeElement;
  input.focus();
  input.select();
  document.execCommand('copy');
  input.parentNode.removeChild(input);
  if (prev) prev.focus();
  document.getElementById('alert').classList.remove('closed');
  setTimeout(function(e){ document.getElementById('alert').classList.add('closed') },1500);
}

function getSubtitle(feature) {
  let t = getType(feature);
  let o = feature.properties;
  let s = '';
  if (o.spawns) {
    s = getType({...feature, 'properties': {...o, 'type': o.spawns, 'name': o.name + ':spawns' }}).title;
    s = s.replace(/ [+-]*\{.+\}(%*)/,''); // remove {} formatting
    if (s==t.title) s='';
  }
  if (o.coins) return `${o.coins} coins`;
  let title = o.text || o.achievement || s;


  if (!title) {
    if (o.area) title = o.area.replace('Supraworld.Area.','');
    if (o.progression) title += ' (' + o.progression.replace('Supraworld.Story.','') + ')';
  }

  if (o.hidden===true || o.exists===false) title +=' (Hidden)';

  return title
}

function getBaseName(name) {
  return name.split(':').shift();
}

function toggleMarked(id) {
  let name = getBaseName(id);

  if (settings.markedItems[name]) {
    delete settings.markedItems[name];
  } else {
    settings.markedItems[name] = true;
  }

  let groupLayer = map.getLayer('GroupGLLayer');
  for (const layer of groupLayer.getLayers()) {
    for (marker of layer._geoList) {
      if (getBaseName(marker.feature.properties.name) == name) {
        let opacity = settings.markedItems[name] ? markedOpacity : 1;
        marker.updateSymbol({markerOpacity: opacity, lineOpacity: opacity });
      }
    }
  }

  saveSettings();
}

function applyHeightFactor(c) {
  if (c.x) return [c.x, c.y, c.z/4];
  return [c[0], c[1], c[2]/4];
}

function addMarker(feature, options) {
  let t = getType(feature);

  //if (t.group=='misc' || t.group=='actors') return;

  let [x,y,z] = applyHeightFactor(feature.geometry.coordinates);

  //console.log(feature.geometry.coordinates);

  let getSymbol = function(feature,opacity=1) {
    return {
      //markerFile   : 'js/lib/maptalks-gl/images/1.png',
      markerFile   : iconImages[t.icon] || iconImages['misc'],
      markerWidth  : iconSize,
      markerHeight : iconSize,
      markerDx     : 0,
      markerDy     : 0,//-Math.round(iconSize/2),
      markerOpacity: opacity,
      //markerVerticalAlignment: 'middle',
    };
  };

  let [layers,counters,icons] = [options.layers, options.counters, options.icons];

  let opacity = settings.markedItems[getBaseName(feature.properties.name)] ? markedOpacity : 1;

  let line = new maptalks.LineString([[x,y,0],[x,y,z]], { symbol: { lineOpacity: opacity} });
  layers.lines = layers.lines||[];
  layers.lines.push(line);
  line.feature = feature;

/*
  var symbol = {
    url: 'js/untitled.glb',
    rotation: [0, 0, 0],
    //fixSizeOnZoom: 0,
    //modelHeight: 5000,
    scaleX: 1000,
    scaleY: 1000,
    scaleZ: 5000,
  };

  layers.gltf = layers.gltf || [];
  let gltf = new maptalks.GLTFMarker([x,y,z], { symbol: symbol});
  layers.gltf.push(gltf);
  gltf.feature = feature;
*/

  let marker = new maptalks.Marker([x,y,z], { symbol: getSymbol(feature, opacity) });
  marker.feature = feature; // leaflet uses marker.feature after loading geojson
  layers[t.group] = layers[t.group] || [];
  layers[t.group].push(marker);

  marker.setInfoWindow({autoCloseOn: 'click'})
  //.on('dragend', onDragEnd)
  .on('click', popupOnClick)
  .on('contextmenu', e=> {
    if (!mouseMoved) toggleMarked(e.target.feature.properties.name);
  })

  let title = t.title || feature.properties.type;

  const tooltip = new maptalks.ui.ToolTip(`${title} (${translate(t.group)}) ${getSubtitle(feature)}`, {
      showTimeout: 100, // Delay in milliseconds before showing the tooltip
      dx: 10,           // X-offset from the geometry
      dy: -10           // Y-offset from the geometry
  });

  tooltip.addTo(marker);

  //if (t.type =='Inventory_Toothpin_C') console.log(feature);

  icons[t.type] = iconData[t.icon];

  counters[t.group] = counters[t.group] || {};
  counters[t.group][t.type] = (counters[t.group][t.type] || 0) + 1;

  if (t.group=='misc') { marker.hide(); line.hide();}

  return marker;
}


function loadMarkersBatched(features, options) {
  const batchSize = 1000;
  let currentIndex = 0;
  let result = [];
  function processBatch() {
    const batch = [];
    const endIndex = Math.min(currentIndex + batchSize, features.length);
    for (; currentIndex < endIndex; currentIndex++) {

      let feature = features[currentIndex];
      let marker = addMarker(feature, options);
      batch.push(marker);

      let o = feature.properties;

      if (o.spawns) {
        batch.push(addMarker({...feature, properties: { name: o.name +':spawns', type: o.spawns}}, options));
      }

      if (o.target) {

        let type = '_LaunchTarget_C'
        if (o.type.includes('RubberBand')) {
          type = '_RubberBandTarget_C';
        } else if (o.type.includes('Spring')) {
          type = '_SpringTarget_C';
        }

        let color = getColor(o.type);

        batch.push(addMarker({...feature, geometry: {coordinates: o.target}, properties: {name: o.name +':target', type: type}}, options));

        let start = applyHeightFactor(feature.geometry.coordinates);
        let end = applyHeightFactor(o.target);
        let opacity = settings.markedItems[o.name] ? markedOpacity : 1;

        let line = new maptalks.LineString([start, end], { symbol: { lineOpacity: opacity, lineColor: color, lineWidth: 3 } });
        let layers = options.layers;
        layers.lines = layers.lines||[];
        layers.lines.push(line);
        line.feature = feature;

      }

    }
    result.push(...batch);
    if (currentIndex < features.length) {
      setTimeout(processBatch, 0); // Allow time for browser events
    } else {
      addMarkers(result, options);
    }
  }
  setTimeout(processBatch, 0); // Start processing asynchronously
}

function loadMarkers(data, mapId) {

  let area = mapId;

  let options = {layers: {}, counters: {}, icons: {}};

  if (mapId!='sw') {
    let features = [];
    for (o of data) {
      let [x,y,z] = [o.lng, o.lat, o.alt];
      let c = [x,y,z];
      let feature = {type: 'Feature', geometry: {type: 'Point', coordinates: c}, properties: o};
      features.push(feature);
    }
    data = features;
  }

/*
  for (feature of data) {
    addMarker(feature, options);
    let o = feature.properties;
    if (o.spawns) {
      addMarker({...feature, 'properties': {...feature.properties, 'type': o.spawns}}, options);
    }
  }
*/

  loadMarkersBatched(data, options);
}

function addMarkers(markers, options) {

  let [layers,counters,icons] = [options.layers, options.counters, options.icons];

  let groupLayer = new maptalks.GroupGLLayer('GroupGLLayer').addTo(map);

  for (const [name, geometries] of Object.entries(layers)) {
    if (name=='lines') {
      new maptalks.LineStringLayer(name, geometries, {
        style: { filter: true, symbol: { lineColor: '#eee', lineWidth: 4, lineOpacity: 0.75 } },
      }).addTo(groupLayer);
    } else if (name=='gltf') {
      new maptalks.GLTFLayer('gltf', geometries,{
        opacity: 0.5,
      }).addTo(groupLayer);

    } else {
      new maptalks.PointLayer(name, geometries, {
        sceneConfig: { depthFunc: '<'},
      }).addTo(groupLayer);
    }
  }

  function toggleGroup(group) {
    searchControl._input.value='';

    // check if group was already toggled - enable all groups
    let options = parseSearchOptions(settings.filter);
    if (options.group == group) {
      filterItems({text:''});
    } else {
      filterItems({group: group});
    }

    location.hash = '';
  }

  function toggleItem(type) {
    searchControl._input.value='';
    filterItems({type:type});
    location.hash = '';
  }

  // let tr = s=> typeData[s]?.title || (s[0].toUpperCase()+s.slice(1));
  let tr = s=> typeData[s]?.title || translate(s);

  markersControl = new MarkersControl(counters, {icons: icons, weights:{collectible: 1, misc:-2, actors:-1}, groupCallback: toggleGroup, itemCallback: toggleItem, translate: tr });

    if (name.includes(':')) {
      settings.filter = name;
    } else {
      settings.filter = 'title:' + name;
    }
  }

  let filterOptions = parseSearchOptions(settings.filter);
  filterItems(filterOptions);
  if (filterOptions.text) {
    searchControl._input.value = filterOptions.text;
  } else if (filterOptions.title) {
    //searchControl._input.value = 'title:'+filterOptions.title;
  }


  mapParam = {};

  saveSettings();
}

function parseSearchOptions(line) {
  if (!line) line = '';

  const terms = ['group', 'type', 'title'];
  const result = {};

  for (const key of terms) {
    const match = line.match(new RegExp(`\\b${key}:([^\\s]+)`));
    if (match) {
      result[key] = match[1];
      line = line.replace(match[0], ''); // strip from text
    }
  }

  line = line.trim();
  if (line) result.text = line;

  return result;
}

function filterItemsExt(s) {
  let options = parseSearchOptions(s);
  filterItems(options);
}

function filterItems(options) {
  let groupLayer = map.getLayer('GroupGLLayer');

  let [type, group, title, text] = [options.type, options.group, options.title, options.text];

  //console.log('filtering by', options);

  if (!group && !type && !title && !text) text = ''; // select all

  let terms = [];
  if (text) {
    terms = text.toLowerCase().split(/\s+/);
  }

  let counter = 0
  let lastMarker = null;

  for (const layer of groupLayer.getLayers()) {
    for (marker of layer._geoList) {

      let res = false;

      if (marker.feature) {
        let t = getType(marker.feature);
        let o = marker.feature.properties;
        res = t.type == type || t.group==group || o.name==title || text=='';

        if (!res && title && t.title) {
          let src = t.title.toLowerCase();
          let term = title.toLowerCase();
          res = src==term || src==term.replaceAll('_',' ');
        }

        let mask = {};
        if (!res && terms.length) {
          for (let s of [t.type, t.title, ...Object.values(o), ...Object.keys(o)]) {
            if (!s) continue;
            s = String(s).toLowerCase();
            for (const term of terms) {
              if (mask[term]) continue;
              if (s.includes(term)) {
                mask[term] = true;
              }
            }
          }
          res = terms.every(term=>mask[term]);
        }

      }

      if (res) {
        marker.show();

        if (marker.type != 'LineString') {
          counter += 1
          lastMarker = marker;
        }

      } else {
        marker.hide();
      }
    }
  }

  // open popup on last marker, counter==2 because lines
  if (counter==1 && lastMarker) {
    let marker = lastMarker;
    popupOnClick({target: marker});
    marker.openInfoWindow();
  }

  searchControl._input.title = `${counter} markers`;

  settings.filter = group ? 'group:'+group : ( type ? 'type:'+type : text );
  //console.log('saving filter', settings.filter);

  // update markers control
  let allSelected = text === '';
  document.querySelectorAll('.markers-control-group').forEach(group => {
    const items = group.parentElement.querySelectorAll('.markers-control-item');
    let anySelected = false;
    const groupSelected = allSelected || group.dataset.name === options.group;
    items.forEach(item => {
      const selected = groupSelected || item.dataset.name === options.type;
      item.classList.toggle('selected', selected);
      anySelected ||= selected;
    });
    group.classList.toggle('selected', groupSelected || anySelected);
  });

  saveSettings();

  return false;
}

function setMarkerZRecursive(layer) {
  if (layer instanceof maptalks.VectorLayer || layer instanceof maptalks.PointLayer) {
    layer.getGeometries().forEach(g => {
      if (g instanceof maptalks.Marker) {
        //console.log(g);
        g.setZIndex(0);
      }
    });
  } else {
    if (layer.getLayers) layer.getLayers().forEach(setMarkerZRecursive);
  }
}


function setHeight() {

function renderFAIconToImageURL(fa_class, bg, fg='white', size=48) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  function drawFAIcon(prefix, iconName, color, pixelSize, dy = 0) {
    let icon = FontAwesome.icon({ prefix, iconName });

    if (!icon) icon = FontAwesome.icon({ prefix:'fa', iconName: 'question-circle' });

    const [w, h, , , path] = icon.icon;
    const scale = pixelSize / h;
    const iconWidthPx = w * scale;
    const dx = (size - iconWidthPx) / 2;
    const dyPx = (size - pixelSize) / 2 + dy;
    ctx.setTransform(scale, 0, 0, scale, dx, dyPx);
    ctx.fillStyle = color;
    ctx.fill(new Path2D(path));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function parseFAClass(faClass) {
    const parts = faClass.trim().split(/\s+/);
    const prefix = parts.find(p => p.startsWith('fa-') || p === 'fa')?.replace('fa-', '') || 'solid';
    const iconName = parts.find(p => p.startsWith('fa-') && p !== 'fa' && p !== `fa-${prefix}`)?.replace('fa-', '');
    const prefixMap = { solid: 'fas', regular: 'far', light: 'fal', thin: 'fat', duotone: 'fad', brands: 'fab' };
    return { prefix: prefixMap[prefix] || 'fas', iconName };
  }

  fg = fg || 'white';
  bg = bg || 'grey';
  let t = parseFAClass(fa_class);
  drawFAIcon('fas', 'location-pin', 'black', size * 1.0);
  drawFAIcon('fas', 'location-pin', bg, size * 0.976);
  drawFAIcon(t.prefix, t.iconName, fg, size * 0.45, -size/8);
  return canvas.toDataURL('image/png');
}

window.onload = function(event) {

  if (location.hash.length>1) {
    let param = decodeURIComponent(location.hash.slice(1));
    mapParam.markerName = param;
  }

  try {
  // clear location hash
    history.pushState('', document.title, window.location.pathname + window.location.search);
  } catch(error) {
    console.log('handled error', error);
  }

  window.addEventListener("keydown", function (e) {

    if (e.target.className=='search-input') {
      return;
    }

    if (e.code=='KeyR' && !e.ctrlKey) {
      if (map.getBearing()!=0) {
        map.animateTo({ bearing: 0 });
      } else {
        map.animateTo({ pitch: map.getPitch()==0 ? defaultPitch : 0 });
      }
    }

    switch (e.code) {
      case 'Digit1': loadMap(Object.keys(maps)[0]); break;
      case 'Digit2': loadMap(Object.keys(maps)[1]); break;
      case 'Digit3': loadMap(Object.keys(maps)[2]); break;
      case 'Digit4': loadMap(Object.keys(maps)[3]); break;
    }

  });

  localData.mapId = localData.mapId || Object.keys(maps)[0];
  let mapId = localData.mapId;

  document.querySelector('#load_data').onclick = loadLocalData; 
  document.querySelector('#save_data').onclick = saveLocalData;
  document.querySelector('#reset_data').onclick = resetLocalData;
  document.querySelector('#copy_path').onclick = copySavePath;
  document.querySelector('#import_save').onclick = importSaveFile;

  let promises = [
    'data/types.json',
    'data/icons.json',
  ].map(url=>fetch(url).then(r=>r.json()));

  Promise.all(promises).then(data => {
    [typeData, iconData] = data;
    iconData['misc'] = {"class": "fa-solid fa-circle-question", "bg": "grey"};
    iconImages = Object.fromEntries(Object.entries(iconData).map(([k,v]) => [k, renderFAIconToImageURL(v.class, v.bg, v.fg, iconSize)]));
    loadMap(mapId);
  }).catch(error=>alert(`A network error occurred. This might be a CORS issue. Check the browser console for details.\n\nError: ${error}`));
}

function saveSettings() {
  localStorage.setItem(localDataName, JSON.stringify(localData));
}

function resetLocalData() {
  if (confirm('Are you sure you want to reset settings?')) {
    localStorage.removeItem(localDataName);
    location.reload();
  }
}

function loadLocalDataExt() {
  var file = document.querySelector("#file").files[0];
  if (file) {
    var reader = new FileReader();
    reader.readAsText(file, "UTF-8");
    reader.onload = function (evt) {
      let data = evt.target.result;
      evt.target.value = null;
      try {
        localData = JSON.parse(data);
        settings = localData[mapId];
        console.log('New settings loaded.');
        saveSettings();
        location.reload();
      } catch(e) {
        console.log(e);
      }
    }
    reader.onerror = function (evt) {
      alert('error reading file');
    }
  }
}

function loadLocalData() {
  document.querySelector('#file').onchange = function(e) {
    loadLocalDataExt();
  }
  document.querySelector('#file').value = null;
  document.querySelector('#file').accept = '.json';
  document.querySelector('#file').click();
}

function saveLocalData() {
  let data = localStorage.getItem(localDataName);
  if (window.showSaveFilePicker) {
    window.showSaveFilePicker({suggestedName: localDataName+'.json'}).then(f=>f.createWritable()).then(f=>f.write(data).then(()=>f.close()));
  } else {
    let filename = localDataName+'.json';
    let blob = new Blob([data], {type: "text/json"});
    if(navigator.msSaveOrOpenBlob) {
        navigator.msSaveOrOpenBlob(blob, filename);
    } else {
        var a = document.body.appendChild(document.createElement("a"));
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        a.remove();
    }
  }
}

function markItems() {
  let groupLayer = map.getLayer('GroupGLLayer');
  for (const layer of groupLayer.getLayers()) {
    for (marker of layer._geoList) {
      let name = getBaseName(marker.feature.properties.name);
      let opacity =  (settings.markedItems[name] || settings.markedItems[name+':spawns']) ? markedOpacity : 1;
      marker.updateSymbol({markerOpacity: opacity, lineOpacity: opacity });
    }
  }
}


function importSaveFileExt() {
  var file = document.querySelector("#game_file").files[0];
  if (file) {
    var reader = new FileReader();
    reader.readAsText(file, "UTF-8");
    reader.onload = function (evt) {
      let data = evt.target.result;
      evt.target.value = null;
      try {

        gameData = JSON.parse(data);
        console.log('Save file loaded.');

        let count = 0;

        for(const [key,o] of Object.entries(gameData.dynamicSaveData.ObjectData)) {
          if (o.ItemIsTaken || o.bFound || o.Active || o.bPickedUp || o.Exists==false || o.State>1 || o.State===0 || o.bUnlocked || o.bIsBroken) {
            let name = key.split('.').pop();
            settings.markedItems[name] = true;
            count += 1;
          }
        }

        markItems();
        saveSettings();

        setTimeout(()=>alert(`Marked ${count} items.`),0);

      } catch(e) {
        console.log(e);
      }
    }
    reader.onerror = function (evt) {
      alert('error reading file');
    }
  }
}
